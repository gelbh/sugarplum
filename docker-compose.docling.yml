# Local docling-serve for PDF figure extraction during development.
#
# Start:
#   docker compose -f docker-compose.docling.yml up -d
#
# Point the Worker at the service (local wrangler / .dev.vars):
#   DOCLING_URL=http://127.0.0.1:5001
#   DOCLING_API_KEY=dev-docling-key
#
# Smoke: open http://127.0.0.1:5001/docs (UI when DOCLING_SERVE_ENABLE_UI=1).
# Stop: docker compose -f docker-compose.docling.yml down

services:
  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.38.2
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_API_KEY: "dev-docling-key"
      DOCLING_SERVE_ENABLE_UI: "1"
      # Local may keep UI; prod runbook turns UI/docs off.
      # Align with Worker MAX_FILE_BYTES / docs/docling-prod.md (50 MiB).
      DOCLING_SERVE_MAX_FILE_SIZE: "52428800"
      DOCLING_SERVE_MAX_NUM_PAGES: "50"
