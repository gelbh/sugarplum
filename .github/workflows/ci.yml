name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Module boundaries
        run: npm run check:boundaries

      - name: Typecheck and build
        run: npm run build
        env:
          # Public CDN origin for allowlisted HTTPS anatomy assets (not a secret).
          VITE_ANATOMY_ASSET_ORIGIN: https://anatomy-assets.gelbhart.dev

      - name: Check Workers asset sizes
        run: node scripts/checkWorkersAssetSize.mjs public && node scripts/checkWorkersAssetSize.mjs dist/client

  # Shard policy: +2 shards when the slowest suite job stays > 5 min (cap 8); decrease when wall < 4 min and cost hurts. Never shard quality.
  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: test:client
        run: npm run test:client

  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: test:worker
        run: npm run test:worker

  ci:
    needs: [quality, test-client, test-worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require leaf jobs
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.test-client.result }}" = "success"
          test "${{ needs.test-worker.result }}" = "success"
