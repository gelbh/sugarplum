name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Module boundaries
        run: npm run check:boundaries

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
        env:
          # Public CDN origin for allowlisted HTTPS anatomy assets (not a secret).
          VITE_ANATOMY_ASSET_ORIGIN: https://anatomy-assets.gelbhart.dev

      - name: Check Workers asset sizes
        run: node scripts/checkWorkersAssetSize.mjs public && node scripts/checkWorkersAssetSize.mjs dist/client
