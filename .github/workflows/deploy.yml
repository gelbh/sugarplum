# Production deploy for sugarplum.gelbhart.dev (A1: main push + workflow_dispatch).
# No PR preview deploys. App secrets stay in Cloudflare via `wrangler secret put`.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
        env:
          # Public CDN origin for allowlisted HTTPS anatomy assets (not a secret).
          VITE_ANATOMY_ASSET_ORIGIN: https://anatomy-assets.gelbhart.dev

      - name: Check Workers asset sizes
        run: node scripts/checkWorkersAssetSize.mjs public && node scripts/checkWorkersAssetSize.mjs dist/client

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.153.0"
          command: d1 migrations apply sugarplum --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.153.0"
          vars: |
            R2_ACCOUNT_ID
          command: deploy
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke production
        run: |
          set -euo pipefail
          url="https://sugarplum.gelbhart.dev"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$url" -o /dev/null; then
              echo "Smoke OK (attempt $attempt)"
              exit 0
            fi
            echo "Smoke not ready (attempt $attempt); retrying in 5s…"
            sleep 5
          done
          echo "::error::Production smoke failed for $url"
          exit 1
