name: zizmor

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  ZIZMOR_VERSION: "1.32.0"

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
